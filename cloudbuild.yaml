steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sitesphere:$COMMIT_SHA', '.']

  # 2. Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sitesphere:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sitesphere-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sitesphere:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Add Cloud SQL connection here
      # - '--add-cloudsql-instances'
      # - '$PROJECT_ID:region:instance-name'
      # Add secrets mapping here
      # - '--set-secrets'
      # - 'DB_PASSWORD=DB_PASSWORD:latest'

images:
  - 'gcr.io/$PROJECT_ID/sitesphere:$COMMIT_SHA'
